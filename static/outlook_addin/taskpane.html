<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assinatura corporativa</title>
  <style>body{font-family:Arial,sans-serif;padding:18px;color:#242424}button{border:0;border-radius:4px;padding:10px 14px;background:#0f6cbd;color:#fff;cursor:pointer}button:disabled{opacity:.6}#status{margin-top:14px;line-height:1.45}.muted{color:#666;font-size:12px}</style>
</head>
<body>
  <h2>Assinatura corporativa</h2>
  <p>Use este comando para atualizar a assinatura desta mensagem com a versão publicada pela TI.</p>
  <button id="atualizar">Atualizar assinatura</button>
  <div id="status" role="status" aria-live="polite"></div>
  <p class="muted">A assinatura é obtida do Gerador de Assinaturas da organização.</p>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="taskpane.js"></script>
</body>
</html>
