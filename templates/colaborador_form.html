{% extends "base.html" %}
{% block titulo %}Colaborador{% endblock %}
{% block conteudo %}
<h1 class="h4 mb-3">{{ 'Novo colaborador' if modo == 'novo' else 'Editar colaborador' }}</h1>
<form method="post" class="card">
  <div class="card-body">
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">Nome *</label><input class="form-control" name="nome" value="{{ colaborador.nome or '' }}" required></div>
      <div class="col-md-6"><label class="form-label">Sobrenome</label><input class="form-control" name="sobrenome" value="{{ colaborador.sobrenome or '' }}"></div>
      <div class="col-md-6"><label class="form-label">Cargo</label><input class="form-control" name="cargo" value="{{ colaborador.cargo or '' }}"></div>
      <div class="col-md-3"><label class="form-label">Departamento</label><input class="form-control" name="departamento" value="{{ colaborador.departamento or '' }}"></div>
      <div class="col-md-3"><label class="form-label">Setor</label><input class="form-control" name="setor" value="{{ colaborador.setor or '' }}"></div>
      <div class="col-md-6"><label class="form-label">E-mail</label><input type="email" class="form-control" name="email" value="{{ colaborador.email or '' }}"></div>
      <div class="col-md-3"><label class="form-label">Telefone</label><input class="form-control" name="telefone" value="{{ colaborador.telefone or '' }}"></div>
      <div class="col-md-3"><label class="form-label">Ramal</label><input class="form-control" name="ramal" value="{{ colaborador.ramal or '' }}"></div>
      <div class="col-md-3"><label class="form-label">Celular</label><input class="form-control" name="celular" value="{{ colaborador.celular or '' }}"></div>
      <div class="col-md-3"><label class="form-label">WhatsApp</label><input class="form-control" name="whatsapp" value="{{ colaborador.whatsapp or '' }}" placeholder="(42) 99999-9999"></div>
      <div class="col-md-6"><label class="form-label">Endereço (opcional, senão usa o da empresa)</label><input class="form-control" name="endereco" value="{{ colaborador.endereco or '' }}"></div>
      <div class="col-md-3"><label class="form-label">Cidade</label><input class="form-control" name="cidade" value="{{ colaborador.cidade or '' }}"></div>
      <div class="col-md-3"><label class="form-label">Estado</label><input class="form-control" name="estado" value="{{ colaborador.estado or '' }}"></div>
      <div class="col-md-8">
        <label class="form-label">URL da foto (HTTPS)</label>
        <input class="form-control" id="foto_url" name="foto_url" value="{{ colaborador.foto_url or '' }}">
        <button type="button" class="btn btn-sm btn-outline-secondary mt-2" onclick="testarImagem('foto_url','resultado_foto')">Testar imagem</button>
        <div id="resultado_foto" class="small mt-1"></div>
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="ativo" id="ativo" {% if colaborador.ativo is not defined or colaborador.ativo %}checked{% endif %}>
          <label class="form-check-label" for="ativo">Colaborador ativo</label>
        </div>
      </div>
    </div>
  </div>
  <div class="card-footer d-flex gap-2">
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="{{ url_for('colaboradores.listar') }}" class="btn btn-outline-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
